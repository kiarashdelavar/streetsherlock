[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "streetsherlock-vision"
version = "0.1.0"
description = "Synthetic Local/CI FastAPI contract stub"
requires-python = ">=3.12.10,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "pydantic-settings==2.10.1",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "ruff==0.12.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/streetsherlock_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
