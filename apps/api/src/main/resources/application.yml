spring:
  application:
    name: streetsherlock-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/streetsherlock}
    username: ${POSTGRES_USER:streetsherlock}
    password: ${POSTGRES_PASSWORD:local-only-change-me}
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://127.0.0.1:8180/realms/streetsherlock-dev/protocol/openid-connect/certs}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

streetsherlock:
  environment: ${APP_ENVIRONMENT:}

management:
  health:
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
      show-details: never
