name: streetsherlock-preview

services:
  api:
    image: ${API_IMAGE:?digest-pinned API_IMAGE is required}
    pull_policy: never
    environment:
      APP_ENVIRONMENT: preview
      DATABASE_URL: ${DATABASE_URL:?managed DATABASE_URL secret is required}
      POSTGRES_USER: ${POSTGRES_USER:?managed database user is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?managed database password is required}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:?preview identity endpoint is required}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    restart: "no"

  web:
    image: ${WEB_IMAGE:?digest-pinned WEB_IMAGE is required}
    pull_policy: never
    depends_on: [api]
    environment:
      STREETSHERLOCK_API_URL: http://api:8080
      STREETSHERLOCK_DEMO_BEARER_TOKEN: ${STREETSHERLOCK_DEMO_BEARER_TOKEN:?managed short-lived synthetic token is required}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    restart: "no"
