name: streetsherlock

services:
  database:
    build:
      context: .
      dockerfile: infra/database/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streetsherlock}
      POSTGRES_USER: ${POSTGRES_USER:-streetsherlock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - streetsherlock_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streetsherlock} -d ${POSTGRES_DB:-streetsherlock}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  flyway:
    image: flyway/flyway:11.8-alpine
    depends_on:
      database:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-streetsherlock}
      FLYWAY_USER: ${POSTGRES_USER:-streetsherlock}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      FLYWAY_CONNECT_RETRIES: "20"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_CLEAN_DISABLED: "true"
    volumes:
      - ./infra/database/migrations:/flyway/sql:ro
    profiles: ["tools"]

  identity:
    image: quay.io/keycloak/keycloak:26.3.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-only-change-me
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${OIDC_PORT:-8180}:8080"
    volumes:
      - ./infra/identity/streetsherlock-dev-realm.json:/opt/keycloak/data/import/streetsherlock-dev-realm.json:ro
    profiles: ["identity"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep 'HTTP/1.1 200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  streetsherlock_postgres:
   
