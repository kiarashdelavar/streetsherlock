name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-policy:
    name: Foundation policy checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Check repository structure
        run: bash scripts/test-structure.sh

      - name: Check database safety contract
        run: bash scripts/test-database-contract.sh

      - name: Check CI security contract
        run: bash scripts/test-ci-contract.sh

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        run: mvn --batch-mode --no-transfer-progress -f apps/api/pom.xml verify

  web-and-contracts:
    name: Web and OpenAPI contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18.0"

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm --filter @streetsherlock/web lint

      - name: Test web
        run: pnpm --filter @streetsherlock/web test

      - name: Build web
        run: pnpm --filter @streetsherlock/web build

      - name: Check OpenAPI contract drift
        run: pnpm contracts:check

  vision:
    name: Vision lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: apps/vision/pyproject.toml

      - name: Install Vision dependencies
        run: python -m pip install -e "apps/vision[dev]"

      - name: Lint Vision
        run: python -m ruff check apps/vision

      - name: Test Vision
        run: python -m pytest apps/vision

  migration-from-empty:
    name: Migration from empty database
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Build database container
        run: docker compose --env-file .env.example build database

      - name: Start clean database
        run: docker compose --env-file .env.example up -d database

      - name: Run migrations
        run: >
          docker compose --env-file .env.example
          --profile tools run --rm flyway migrate

      - name: Validate migrations
        run: >
          docker compose --env-file .env.example
          --profile tools run --rm flyway validate

      - name: Verify database
        run: bash scripts/verify-database.sh

      - name: Remove CI database
        if: always()
        run: >
          docker compose --env-file .env.example
          --profile tools down --volumes --remove-orphans

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan locked dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  filesystem-scan:
    name: Filesystem security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table